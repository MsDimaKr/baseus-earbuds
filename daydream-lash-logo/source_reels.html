<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2860px;background:#E9DAD0;font-family:Manrope;padding:30px 20px 24px}
.row{display:flex;gap:20px}
.f{width:520px}
.f svg{width:520px;height:924px;display:block;border-radius:22px;box-shadow:0 6px 24px #3025222a}
.cap{margin-top:14px;font:700 24px Manrope;color:#8F5B5C;letter-spacing:.06em}
.sub{font:500 21px Manrope;color:#8a7068;margin-top:4px;line-height:1.35}
.serif{font-family:'Cormorant Garamond',serif}
</style></head><body>
<div class="row" id="row"></div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
const NB=' ';
function grad(svg,id){const d=el(svg,'defs',{});const g=el(d,'linearGradient',{id,x1:0,y1:0,x2:1,y2:1});
 [['0','#C9979A'],['.5','#A86F72'],['1','#8F5B5C']].forEach(s=>el(g,'stop',{offset:s[0],'stop-color':s[1]}));
 const b=el(d,'filter',{id:'bl',x:'-20%',y:'-20%',width:'140%',height:'140%'});el(b,'feGaussianBlur',{stdDeviation:60});
 const sh=el(d,'filter',{id:'sh',x:'-30%',y:'-30%',width:'160%',height:'160%'});el(sh,'feDropShadow',{dx:0,dy:4,stdDeviation:10,'flood-color':'#000','flood-opacity':.35});}
function fan(g,cx,cy,rx,ry,a0,a1,n,len0,len1,w,color,bend=.28){
 for(let i=0;i<n;i++){const u=i/(n-1);const th=(a0+(a1-a0)*u)*Math.PI/180;
  const px=cx+rx*Math.cos(th),py=cy+ry*Math.sin(th);let nx=Math.cos(th)/rx,ny=Math.sin(th)/ry;const nl=Math.hypot(nx,ny);nx/=nl;ny/=nl;
  const side=Math.cos(th)>=0?1:-1;const L=len0+(len1-len0)*Math.sin(Math.PI*(.12+.76*u));
  const ex=px+nx*L+ny*bend*L*side,ey=py+ny*L-nx*bend*L*side;
  el(g,'path',{d:`M${px.toFixed(1)} ${py.toFixed(1)} Q${(px+nx*L*.55).toFixed(1)} ${(py+ny*L*.55).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`,fill:'none',stroke:color,'stroke-width':w,'stroke-linecap':'round'});}}
// sun-lash mark, unit r=150 centred on horizon (cx,cy)
function sun(svg,cx,cy,s,fill,line,id){const g=el(svg,'g',{transform:`translate(${cx} ${cy}) scale(${s})`});
 el(g,'path',{d:'M-150 0 A150 150 0 0 1 150 0 Z',fill});
 el(g,'line',{x1:-230,y1:0,x2:230,y2:0,stroke:line,'stroke-width':6,'stroke-linecap':'round'});
 fan(g,0,0,150,150,198,342,15,46,90,7,line);return g}
function eye(svg,cx,cy,s,lid,lash){const g=el(svg,'g',{transform:`translate(${cx} ${cy}) scale(${s})`});
 el(g,'path',{d:'M-220 0 Q0 140 220 0',fill:'none',stroke:lid,'stroke-width':12,'stroke-linecap':'round'});
 for(let i=0;i<11;i++){const u=i/10;const bx=(1-u)*(1-u)*-220+u*u*220,by=2*(1-u)*u*140;
  const tx=2*(1-u)*220+2*u*220,ty=2*(1-u)*140-2*u*140;const tl=Math.hypot(tx,ty);let nx=ty/tl,ny=-tx/tl;if(ny<0){nx=-nx;ny=-ny}
  const L=44+60*Math.sin(Math.PI*(.1+.8*u));const sd=(u-.5)*2;const ex=bx+nx*L+sd*L*.38,ey=by+ny*L;
  el(g,'path',{d:`M${bx.toFixed(1)} ${by.toFixed(1)} Q${(bx+nx*L*.6).toFixed(1)} ${(by+ny*L*.6).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`,fill:'none',stroke:lash,'stroke-width':7,'stroke-linecap':'round'});}
 return g}
function sparkle(g,x,y,r,c){el(g,'path',{d:`M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z`,fill:c})}
function T(p,x,y,txt,a,anchor='middle'){return el(p,'text',Object.assign({x,y,'text-anchor':anchor},a),txt)}
function frame(cap,sub,build){const d=document.createElement('div');d.className='f';
 const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 1080 1920');d.appendChild(svg);
 d.insertAdjacentHTML('beforeend',`<div class="cap">${cap}</div><div class="sub">${sub}</div>`);
 document.getElementById('row').appendChild(d);grad(svg,'g');build(svg);return svg}
function bgBeige(s){el(s,'rect',{width:1080,height:1920,fill:'#F3E8E1'});el(s,'circle',{cx:200,cy:380,r:380,fill:'#C9979A',opacity:.45,filter:'url(#bl)'});el(s,'circle',{cx:920,cy:1500,r:420,fill:'#B77F80',opacity:.35,filter:'url(#bl)'});}
function bgPhoto(s){el(s,'rect',{width:1080,height:1920,fill:'#6b4a47'});
 el(s,'circle',{cx:300,cy:600,r:460,fill:'#D9A9A0',opacity:.8,filter:'url(#bl)'});el(s,'circle',{cx:800,cy:1200,r:520,fill:'#2d1f1d',opacity:.9,filter:'url(#bl)'});el(s,'circle',{cx:620,cy:420,r:300,fill:'#F3D9CC',opacity:.6,filter:'url(#bl)'});
 T(s,540,980,'кадр из видео',{'font-size':44,fill:'#F3E8E1','fill-opacity':.45,'letter-spacing':'.1em'});}
function guides(s){}

// 1 — заставка
frame('1 · ЗАСТАВКА','Первые 1–2 сек ролика. Центр кадра, крупно, читается с первого взгляда.',s=>{bgBeige(s);
 sun(s,540,860,1.55,'url(#g)','#302522');
 T(s,540,1110,'Daydream',{class:'serif','font-size':230,'font-weight':600,'font-style':'italic',fill:'#302522'});
 T(s,540,1210,'LASH'+NB+NB+NB+'STUDIO',{'font-size':54,'font-weight':600,fill:'#B77F80','letter-spacing':'.38em'});});

// 2 — водяной знак
frame('2 · ВОДЯНОЙ ЗНАК','Маленький логотип поверх видео. Сверху, ниже панели Instagram. Полупрозрачный.',s=>{bgPhoto(s);
 const g=el(s,'g',{opacity:.92,filter:'url(#sh)'});
 sun(g,150,330,.42,'#F3E8E1','#F3E8E1');
 T(g,236,325,'Daydream',{class:'serif','font-size':72,'font-weight':600,'font-style':'italic',fill:'#F3E8E1'},'start');
 T(g,238,372,'LASH',{'font-size':26,'font-weight':700,fill:'#F3E8E1','letter-spacing':'.5em'},'start');});

// 3 — финальная плашка
frame('3 · ФИНАЛЬНАЯ ПЛАШКА','Последний кадр: логотип, ник и призыв к записи. Нижние 340 px оставлены свободными под интерфейс.',s=>{bgBeige(s);
 el(s,'rect',{x:110,y:420,width:860,height:1000,rx:60,fill:'#F3E8E1',stroke:'#B77F80','stroke-width':3,opacity:.9});
 eye(s,540,610,1.15,'url(#g)','#302522');
 const sp=el(s,'g',{});sparkle(sp,840,540,40,'#B77F80');sparkle(sp,300,510,22,'#C9979A');sparkle(sp,880,440,18,'#C9979A');
 T(s,540,1030,'Daydream',{class:'serif','font-size':200,'font-weight':600,'font-style':'italic',fill:'#302522'});
 T(s,540,1140,'L'+NB+'A'+NB+'S'+NB+'H',{'font-size':54,'font-weight':600,fill:'#B77F80','letter-spacing':'.7em'});
 el(s,'rect',{x:300,y:1190,width:480,height:92,rx:46,fill:'url(#g)'});
 T(s,540,1252,'@daydream.lash',{'font-size':44,'font-weight':600,fill:'#F3E8E1'});
 T(s,540,1360,'Запись в директ',{'font-size':40,'font-weight':600,fill:'#8F5B5C','letter-spacing':'.06em'});});

// 4 — печать
frame('4 · ПЕЧАТЬ-БЕЙДЖ','Круглая печать на видео (например, в начале или на «до/после»). Хорошо работает как стикер.',s=>{bgPhoto(s);
 const g=el(s,'g',{transform:'translate(800 400)',filter:'url(#sh)'});
 el(g,'circle',{r:190,fill:'url(#g)'});el(g,'circle',{r:174,fill:'none',stroke:'#F3E8E1','stroke-width':3});el(g,'circle',{r:112,fill:'none',stroke:'#F3E8E1','stroke-width':3});
 el(g,'path',{id:'rp',d:'M-143 0 a143 143 0 1 1 286 0 a143 143 0 1 1 -286 0',fill:'none'});
 const t=el(g,'text',{'font-size':27,'font-weight':600,fill:'#F3E8E1','letter-spacing':'.22em'});
 el(t,'textPath',{href:'#rp'},'DAYDREAM'+NB+'LASH'+NB+NB+'·'+NB+NB+'LASH'+NB+'EXTENSIONS'+NB+NB+'·'+NB+NB);
 el(g,'path',{d:'M-52 12 a28 28 0 0 1 11 -54 a38 38 0 0 1 70 -10 a30 30 0 0 1 39 50 a22 22 0 0 1 -6 14Z',fill:'#F3E8E1'});
 for(let i=0;i<7;i++){const u=i/6;const x=-40+u*80;const L=18+14*Math.sin(Math.PI*(.1+.8*u));
  el(g,'path',{d:`M${x} 26 q ${(u-.5)*10} ${L*.6} ${(u-.5)*28} ${L}`,fill:'none',stroke:'#F3E8E1','stroke-width':4,'stroke-linecap':'round'});}});

// 5 — титр на тёмном
frame('5 · ТИТР / ВСТАВКА','Тёмная вставка между сценами или в конце: монограмма DL с лучами и название.',s=>{
 el(s,'rect',{width:1080,height:1920,fill:'#302522'});el(s,'circle',{cx:540,cy:840,r:420,fill:'#B77F80',opacity:.28,filter:'url(#bl)'});
 el(s,'circle',{cx:540,cy:840,r:250,fill:'url(#g)'});
 T(s,500,960,'D',{class:'serif','font-size':400,'font-weight':700,'font-style':'italic',fill:'#F3E8E1'});
 T(s,640,985,'L',{class:'serif','font-size':350,'font-weight':600,'font-style':'italic',fill:'#302522','fill-opacity':.88});
 fan(s,540,840,262,262,205,335,15,24,56,7,'#C9979A');
 T(s,540,1240,'Daydream Lash',{class:'serif','font-size':140,'font-weight':600,'font-style':'italic',fill:'#F3E8E1'});
 T(s,540,1320,'L'+NB+'A'+NB+'S'+NB+'H'+NB+NB+NB+'E'+NB+'X'+NB+'T'+NB+'E'+NB+'N'+NB+'S'+NB+'I'+NB+'O'+NB+'N'+NB+'S',{'font-size':36,'font-weight':600,fill:'#C9979A','letter-spacing':'.3em'});});
document.fonts.ready.then(()=>document.body.setAttribute('data-ready',1));
</script></body></html>
